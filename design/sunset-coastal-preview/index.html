max-width:480px;width:calc(100% - 32px);box-shadow:0 15px 70px #152d3e2b}dialog::backdrop{background:#173c3850}.drawer{padding:27px}.drawer .close{float:right}.drawer h2{font-size:23px;margin-top:13px}.drawer dl{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.drawer .notice{margin:25px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--ink);color:white;font-size:12px;border-radius:7px;z-index:10;max-width:90%;box-shadow:0 5px 25px #203b3a30}.hidden{display:none!important}input[type=checkbox]{width:17px;height:17px} @media(max-width:1100px){.inbox{grid-template-columns:230px minmax(0,1fr)}.guest{display:none}.layout{grid-template-columns:minmax(0,1fr) 230px}.head-right{gap:10px}}@media(max-width:800px){header{padding:0 20px;height:75px}nav{padding:0 20px;gap:24px}main{padding:25px 20px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:22px}.side .aside-section:last-child{display:none}.page-top{align-items:flex-start}.page-top .actions{flex-wrap:wrap;justify-content:flex-end}.summary{gap:20px}.catalog{grid-template-columns:1fr}.head-right .location{display:none}h1{font-size:27px}footer{padding:17px 20px}.inbox{grid-template-columns:200px minmax(0,1fr)}}@media(max-width:550px){.head-right .quiet{display:none}.brand strong{font-size:19px}.demo{font-size:9px;padding:8px 12px}.page-top{display:block}.page-top .actions{justify-content:flex-start;margin-top:16px}.summary{justify-content:space-between;gap:8px}.summary b{display:block;margin:0}.summary span{font-size:10px}.panel-head{padding:14px;flex-wrap:wrap}.side{display:block}.inbox{display:block}.thread-list{border-right:0;max-height:220px;overflow:auto;border-bottom:1px solid var(--line)}.thread{min-height:75px;padding:12px 16px}.messages{padding:17px}.bubble{max-width:95%}button{min-height:44px}nav{justify-content:space-between;gap:8px}nav button{font-size:12px}.count{display:none}footer span:last-child{display:none}.no [hidden]{display:none!important}.avatar{flex-shrink:0}@media(max-width:550px){.schedule-scroll:before{content:'Swipe across to see all instructors →';display:block;padding:9px 14px;font-size:10px;color:var(--muted)}}
</style></head><body>
<div class="demo"><b>DESIGN PREVIEW</b> · sample data · nothing is sent or saved</div>
<header><div class="brand"><span class="mark" aria-hidden="true">≈</span><div><strong>sunset</strong><small>Luna front desk</small></div></div><div class="head-right"><span class="location">Somo, Cantabria &nbsp; / &nbsp; Staff workspace</span><button class="quiet" data-demo="Location switching is illustrative only.">Somo ⌄</button><span class="avatar" title="Fictional staff profile">AL</span></div></header>
<nav aria-label="Workspace"><button class="active" data-page="schedule">Schedule</button><button data-page="inbox">Inbox <span class="count">2</span></button><button data-page="bookings">Bookings</button><button data-page="admin">Admin</button></nav>
<main id="main"></main><footer><span>SUNSET SURF SCHOOL &nbsp; / &nbsp; Coastal Workspace</span><span>Made for quieter days at the desk.</span></footer>
<dialog id="detail" aria-labelledby="detailTitle"><div class="drawer" id="drawer"></div></dialog><div class="toast hidden" id="toast" role="status"></div>
<script>
const main=document.querySelector('#main');let page='schedule',selected=0,day=0;const drafts={};
const sessions=[{title:'First waves',time:'09:00 – 10:30',teacher:'Ada Sol',group:'6 beginners',name:'Noa Vale',gear:'6 softboards · 6 wetsuits',type:'Group lesson',color:''},{title:'Private coaching',time:'09:00 – 10:00',teacher:'Ivo Mar',group:'2 surfers',name:'Milo Reed',gear:'2 boards · 2 wetsuits',type:'Private lesson',color:'sand'},{title:'Find your flow',time:'10:30 – 12:00',teacher:'Ada Sol',group:'5 improvers',name:'Lina Fern',gear:'5 boards · 5 wetsuits',type:'Group lesson',color:''},{title:'Ocean explorers',time:'10:30 – 12:00',teacher:'Neri Cove',group:'4 young surfers',name:'Eli Moss',gear:'4 softboards · 4 wetsuits',type:'Group lesson',color:'blue'},{title:'Afternoon introduction',time:'12:00 – 13:30',teacher:'Ivo Mar',group:'6 beginners',name:'Alba Wren',gear:'6 softboards · 6 wetsuits',type:'Group lesson',color:''},{title:'Surf at your pace',time:'13:30 – 15:00',teacher:'Neri Cove',group:'3 improvers',name:'Theo Bay',gear:'3 boards · 3 wetsuits',type:'Group lesson',color:'blue'}];
const people=[{name:'Noa Vale',channel:'WhatsApp',tag:'Needs a reply',preview:'Can we arrive a little before the lesson?',message:'Hi! We are excited for our first lesson. Can we arrive a little early to get our wetsuits?',reply:'Hi Noa! Arriving 15 minutes early gives you time to get comfortable and pick up your gear. See you at the school!',booking:'First waves · 09:00',size:'2 guests'},{name:'Milo Reed',channel:'Email',tag:'Draft ready',preview:'A quick question about our private session',message:'Hello! Is there anything we should bring along to the private coaching session?',reply:'Hi Milo, bring swimwear, a towel and some sunscreen. Your instructor will help with the equipment when you arrive. Looking forward to seeing you!',booking:'Private coaching · 09:00',size:'2 guests'},{name:'Lina Fern',channel:'WhatsApp',tag:'Up to date',preview:'Perfect, see you in the morning!',message:'Perfect, see you in the morning!',reply:'Looking forward to it, Lina. Have a lovely evening!',booking:'Find your flow · 10:30',size:'1 guest'}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),3500)}
function lesson(i){const s=sessions[i];return `<button class="lesson ${s.color}" data-session="${i}"><span class="eyebrow">${s.time}</span><strong>${s.title}</strong><small>${s.group} · ${s.teacher}</small></button>`}
function pageHeading(title,sub,actions=''){return `<div class="page-top"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function renderSchedule(){const dates=['Saturday, 5 September','Sunday, 6 September','Monday, 7 September'];const slots=day===0?{0:0,1:1,3:2,5:3,7:4,11:5}:{2:1,4:2,6:0,9:5};main.innerHTML=pageHeading('A good day starts here.','Your lessons, people and preparations. All in one place.',`<button data-demo="This preview does not create bookings.">＋ New booking</button>`)+`<div class="summary"><span><b>${day===0?'6':'4'}</b> lessons today</span><span><b>${day===0?'26':'16'}</b> surfers expected</span><span><b>3</b> instructors</span><span><b>2</b> things to prepare</span></div><div class="layout"><section class="panel"><div class="panel-head"><div><h2>${dates[day]}</h2><span class="sub">Illustrative schedule · Somo beach</span></div><div class="row"><button class="quiet" aria-label="Previous sample day" data-day="-1">‹</button><button class="quiet" data-today>Today</button><button class="quiet" aria-label="Next sample day" data-day="1">›</button></div></div><div class="schedule-scroll"><div class="schedule"><div class="col-head"></div><div class="col-head">Ada Sol<span>Group lessons</span></div><div class="col-head">Ivo Mar<span>Private & group</span></div><div class="col-head">Neri Cove<span>Juniors & improvers</span></div>${['09:00','10:30','12:00','13:30'].map((t,r)=>`<div class="time">${t}</div>${[0,1,2].map(c=>`<div class="cell">${slots[r*3+c]!==undefined?lesson(slots[r*3+c]):''}</div>`).join('')}`).join('')}</div></div><div class="legend"><span><i class="dot"></i>Group lesson</span><span><i class="dot sand"></i>Private coaching</span><span><i class="dot blue"></i>Juniors & improvers</span></div></section><aside class="side"><section class="aside-section"><h2>Before the first wave</h2><div class="notice"><strong>A little preparation goes a long way.</strong><p>Two sample tasks for the morning team.</p></div><label class="check"><input type="checkbox"><span>Set aside junior wetsuits<small>Ocean explorers · 10:30</small></span></label><label class="check"><input type="checkbox"><span>Prepare the coaching boards<small>Private coaching · 09:00</small></span></label></section><section class="aside-section"><h2>On the beach today</h2>${['Ada Sol','Ivo Mar','Neri Cove'].map((n,i)=>`<div class="crew"><span class="avatar">${n.split(' ').map(s=>s[0]).join('')}</span><div>${n}<small>${['Group lessons · morning','Private coaching · all day','Juniors & improvers'][i]}</small></div></div>`).join('')}</section><section class="aside-section"><span class="eyebrow">A calmer workspace</span><p style="font-size:12px;margin-top:8px">Less searching. More time with the people in front of you.</p></section></aside></div><div class="note-bottom">All names, sessions and counts shown are fictional design examples.</div>`}
function renderInbox(){const p=people[selected];main.innerHTML=pageHeading('A conversation, not a queue.','The guest, their message and your next step.',`<span class="tag">Channel controls · preview only</span>`)+`<div class="panel"><div class="panel-head"><div class="row"><span class="sub">WhatsApp</span><span class="tag">Auto · sample</span><span class="sub">Email</span><span class="tag">Draft · sample</span></div><span class="sub">No channels connected</span></div><div class="inbox"><section class="thread-list" aria-label="Sample conversations"><input class="search" id="search" placeholder="Find a guest…" aria-label="Find a guest">${people.map((x,i)=>`<button class="thread ${i===selected?'active':''}" data-person="${i}"><span class="tag ${i<2?'attention':''}">${x.channel}</span><strong>${x.name}</strong><small>${x.preview}</small><small>${x.tag}</small></button>`).join('')}</section><section class="conversation"><div class="panel-head"><div><h2>${p.name}</h2><span class="sub">${p.channel} · fictional conversation</span></div><span class="tag">Luna on · sample</span></div><div class="messages"><div class="stamp">Saturday, 5 September · Sample conversation</div><div class="bubble">${p.message}</div><div class="draft"><label for="draft">Luna’s draft · editable preview</label><textarea id="draft">${esc(drafts[selected]??p.reply)}</textarea><div class="row"><button data-reset-draft>Reset draft</button><button class="primary" disabled title="Sending is unavailable in this mockup">Send unavailable</button></div></div><p class="sub" style="margin-top:14px">Try editing the draft. Changes exist only in this page and disappear on refresh.</p></div></section><aside class="guest"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('')}</div><h3 style="margin-top:14px">${p.name}</h3><span class="sub">Guest at a glance</span><dl><dt>Session</dt><dd>${p.booking}</dd><dt>Party</dt><dd>${p.size}</dd><dt>Status</dt><dd>Sample booking</dd><dt>Staff notes</dt><dd>First visit to Somo.</dd></dl></aside></div></div>`}
function renderBookings(){main.innerHTML=pageHeading('Every guest, accounted for.','A clear view of the day’s sample bookings.',`<button data-demo="Export is not connected in this design preview.">Export</button><button class="primary" data-demo="Booking creation is unavailable in the mockup.">＋ New booking</button>`)+`<section class="panel"><div class="panel-head"><h2>Upcoming bookings</h2><span class="sub">Fictional records · not live availability</span></div><div class="table-scroll"><table><thead><tr><th>Guest</th><th>Experience</th><th>When</th><th>Sample status</th><th></th></tr></thead><tbody>${sessions.map((s,i)=>`<tr><td><strong>${s.name}</strong><br><span class="sub">Preview ${'00'+(i+1)}</span></td><td>${s.title}</td><td>5 September<br><span class="sub">${s.time}</span></td><td><span class="tag ${i===3?'attention':''}">${i===3?'Waiver needed':'Ready for the beach'}</span></td><td><button data-session="${i}">View details</button></td></tr>`).join('')}</tbody></table></div></section>`}
function renderAdmin(){main.innerHTML=pageHeading('Simple behind the scenes.','Your offerings and workspace, brought together.',`<span class="tag attention">Illustrative settings — not connected</span>`)+`<div class="panel"><div class="panel-head"><h2>Experience catalog</h2><span class="sub">Sample offerings & prices — not Sunset’s actual rates</span></div></div><div class="catalog">${[{n:'Group surf lesson',s:'Learn together. Find your feet.',p:'€40',u:'per person · example only',d:'90 minutes · equipment included'},{n:'Private coaching',s:'Time and attention, just for you.',p:'€80',u:'per session · example only',d:'60 minutes · tailored instruction'},{n:'Board & wetsuit',s:'A little more time in the water.',p:'€25',u:'per day · example only',d:'Sample rental · no stock connected'}].map(x=>`<article class="panel"><span class="eyebrow">Sample catalog</span><h2 style="margin-top:12px">${x.n}</h2><p class="sub" style="margin-top:7px">${x.s}</p><div class="price">${x.p}</div><small>${x.u}</small><p class="sub" style="margin-top:19px">${x.d}</p><button data-demo="Catalog editing is illustrative. No real price or stock is changed.">Preview settings</button></article>`).join('')}</div><section class="panel" style="margin-top:25px"><div class="panel-head"><h2>Workspace</h2></div><div class="settings-row"><div><strong>School & location</strong><p>Somo · Cantabria, Spain</p></div><button data-demo="Location settings are not connected.">View setting</button></div><div class="settings-row"><div><strong>Channels & Luna</strong><p>Channel-wide controls stay separate from guest-level controls.</p></div><button data-go-inbox>Preview in Inbox</button></div></section>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});({schedule:renderSchedule,inbox:renderInbox,bookings:renderBookings,admin:renderAdmin}[page])()}
function openSession(i){const s=sessions[i];document.querySelector('#drawer').innerHTML=`<button class="quiet close" aria-label="Close booking details" data-close>✕</button><span class="eyebrow">Sample booking · preview only</span><h2 id="detailTitle">${s.title}</h2><p>${s.name} · fictional guest</p><dl><div><dt>Time</dt><dd>5 September<br>${s.time}</dd></div><div><dt>Instructor</dt><dd>${s.teacher}</dd></div><div><dt>Experience</dt><dd>${s.type}</dd></div><div><dt>Session size</dt><dd>${s.group}</dd></div><div><dt>Equipment preparation</dt><dd>${s.gear}</dd></div></dl><div class="notice">This drawer demonstrates the booking layout. No real reservation, availability or payment information is loaded.</div><button class="primary" data-close>Back to workspace</button>`;document.querySelector('#detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.session!==undefined)openSession(Number(b.dataset.session));if(b.hasAttribute('data-close'))document.querySelector('#detail').close();if(b.dataset.demo)toast(b.dataset.demo);if(b.dataset.day){day=(day+Number(b.dataset.day)+3)%3;renderSchedule()}if(b.hasAttribute('data-today')){day=0;renderSchedule()}if(b.dataset.person!==undefined){selected=Number(b.dataset.person);renderInbox()}if(b.hasAttribute('data-reset-draft')){delete drafts[selected];renderInbox();toast('Sample draft reset. Nothing sent.')}if(b.hasAttribute('data-go-inbox')){page='inbox';render()}});
document.addEventListener('input',e=>{if(e.target.id==='draft')drafts[selected]=e.target.value;if(e.target.id==='search'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-person]').forEach(b=>b.hidden=!people[Number(b.dataset.person)].name.toLowerCase().includes(q))}});render();
</script></body></html>
