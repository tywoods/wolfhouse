name: Luna v3 Cap authentic rendered replies
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  authentic-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ARTIFACT_DIR: artifacts/rendered-reply-matrix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.candidate_sha }}'
          persist-credentials: false
      - name: Prove exact head and record secret preflight
        id: preflight
        env:
          MODEL_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          CANDIDATE_SHA: '${{ inputs.candidate_sha }}'
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/preflight"
          actual=$(git rev-parse HEAD)
          test "$actual" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['ARTIFACT_DIR'])/'preflight'/'model-provider.json'
          key=os.environ.get('MODEL_API_KEY','')
          doc={'schema':'luna-v3-cap-model-preflight/v1','candidate_sha':os.environ['CANDIDATE_SHA'],
               'checkout_sha':os.popen('git rev-parse HEAD').read().strip(),'provider':'openai-codex',
               'model':'gpt-6.1-sol','reasoning':'low','temperature':'provider-default','fallback':'',
               'secret_name':'OPENAI_API_KEY','secret_present':bool(key),
               'secret_fingerprint_sha256':hashlib.sha256(key.encode()).hexdigest() if key else None,
               'verdict':'READY' if key else 'BLOCKED','reason':None if key else 'OPENAI_API_KEY repository secret is absent'}
          out.write_text(json.dumps(doc,sort_keys=True,indent=2)+'\n')
          PY
          if test -n "$MODEL_API_KEY"; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Upload blocker preflight
        if: steps.preflight.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: luna-v3-cap-authentic-${{ inputs.candidate_sha }}
          path: artifacts/rendered-reply-matrix/
          retention-days: 30
      - name: Stop with precise model-secret blocker
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo 'BLOCKED: OPENAI_API_KEY repository secret is absent; no model call or matrix result was fabricated.'
          exit 1
      - name: Reject non-local runtime origins and run offline gates
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest docker/hermes-luna-v3/tests/test_simulator_route.py -v
          python3 -m unittest docker/hermes-luna-v3/plugins/luna_v3_staff_api/test_plugin.py -v
          python3 scripts/test-luna-v3-rendered-reply-harness.py
          ! grep -E 'LUNA_V3_CAP_(SIMULATOR_URL|SIMULATOR_TOKEN|TRACE_TOKEN)' .github/workflows/luna-v3-cap-authentic-matrix.yml
      - name: Build exact-head Staff and Hermes candidates
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          docker build --pull=false -t cap-staff:${{ inputs.candidate_sha }} -f Dockerfile .
          docker build --pull=false -t cap-hermes:${{ inputs.candidate_sha }} docker/hermes-luna-v3
          docker image inspect cap-staff:${{ inputs.candidate_sha }} cap-hermes:${{ inputs.candidate_sha }} > "$ARTIFACT_DIR/image-inspect.json"
      - name: Run isolated PostgreSQL, migrations, fixture, candidates, and matrix
        if: steps.preflight.outputs.ready == 'true'
        env:
          MODEL_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          CANDIDATE_SHA: '${{ inputs.candidate_sha }}'
        run: scripts/run-luna-v3-cap-isolated-ci.sh
      - name: Upload evidence always
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: luna-v3-cap-authentic-${{ inputs.candidate_sha }}
          path: artifacts/rendered-reply-matrix/
          retention-days: 30
