services:
  hermes-orchestrator:
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set to whstagingacr.azurecr.io/wh-hermes-staging:<full-master-sha>}
    container_name: hermes-orchestrator
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
    volumes:
      - /var/lib/hermes-orchestrator:/opt/data
      # OpenAI clone source only — do NOT mount as HERMES_HOME/.auth-shared.
      # That path lets Hermes rediscover Anthropic OAuth from the shared pool
      # and puke Claude "extra usage" 400s into Discord while main chat is Codex.
      - /var/lib/hermes-shared:/var/lib/hermes-shared:ro
      - /opt/wolfhouse/WH:/opt/wolfhouse/WH:ro
      - /opt/wolfhouse/WH/docker/hermes-staging/bootstrap.sh:/etc/cont-init.d/99-wh-staging-bootstrap:ro
      - /opt/wolfhouse/WH/docker/hermes-staging/99z-wh-vm-post-bootstrap.sh:/etc/cont-init.d/99z-wh-vm-post-bootstrap:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_ROLE: orchestrator
      HERMES_DASHBOARD: "0"
      GENERIC_TIMEZONE: Europe/Madrid
      WOLFHOUSE_STAFF_API_BASE_URL: https://staff-staging.lunafrontdesk.com
    env_file:
      - /etc/hermes-orchestrator.env

  hermes-luna:
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set to whstagingacr.azurecr.io/wh-hermes-staging:<full-master-sha>}
    container_name: hermes-luna
    restart: unless-stopped
    command: gateway run
    ports:
      - "8090:8090"
    volumes:
      - /var/lib/hermes-luna:/opt/data
      - /var/lib/hermes-shared:/opt/data/.auth-shared
      - /opt/wolfhouse/WH/docker/hermes-staging/99z-wh-vm-post-bootstrap.sh:/etc/cont-init.d/99z-wh-vm-post-bootstrap:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_ROLE: luna
      LUNA_CLIENT_SLUG: wolfhouse-somo
      HERMES_DASHBOARD: "0"
      GENERIC_TIMEZONE: Europe/Madrid
      WOLFHOUSE_STAFF_API_BASE_URL: https://staff-staging.lunafrontdesk.com
    env_file:
      - /etc/hermes-luna.env

  hermes-wolfhouse-luna:
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set to whstagingacr.azurecr.io/wh-hermes-staging:<full-master-sha>}
    container_name: hermes-wolfhouse-luna
    restart: unless-stopped
    command: gateway run
    ports:
      - "8091:8091"
    volumes:
      - /var/lib/hermes-wolfhouse-luna:/opt/data
      - /var/lib/hermes-shared:/opt/data/.auth-shared
      - /opt/wolfhouse/WH/docker/hermes-staging/99z-wh-vm-post-bootstrap.sh:/etc/cont-init.d/99z-wh-vm-post-bootstrap:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_ROLE: luna
      LUNA_CLIENT_SLUG: wolfhouse-somo
      HERMES_DASHBOARD: "0"
      GENERIC_TIMEZONE: Europe/Madrid
      WOLFHOUSE_STAFF_API_BASE_URL: https://staff-staging.lunafrontdesk.com
      WHATSAPP_CLOUD_WEBHOOK_PORT: "8091"
    env_file:
      - /etc/hermes-wolfhouse-luna.env

  hermes-deckhand:
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set to whstagingacr.azurecr.io/wh-hermes-staging:<full-master-sha>}
    container_name: hermes-deckhand
    restart: unless-stopped
    command: gateway run
    volumes:
      - /var/lib/hermes-deckhand:/opt/data
      - /var/lib/hermes-shared:/opt/data/.auth-shared
      - /opt/wolfhouse/WH:/opt/wolfhouse/WH:ro
      - /opt/wolfhouse/WH/docker/hermes-staging/99z-wh-vm-post-bootstrap.sh:/etc/cont-init.d/99z-wh-vm-post-bootstrap:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_ROLE: deckhand
      HERMES_DASHBOARD: "0"
      GENERIC_TIMEZONE: Europe/Madrid
      WOLFHOUSE_STAFF_API_BASE_URL: https://staff-staging.lunafrontdesk.com
    env_file:
      - /etc/hermes-deckhand.env
