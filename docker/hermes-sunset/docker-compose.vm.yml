services:
  # Guest WhatsApp for Sunset Somo. Kill switches live in /etc/hermes-sunset-luna.env,
  # deliberately not here: Luna will not send unless WHATSAPP_DRY_RUN=false AND
  # LUNA_AUTO_SEND_ENABLED=true, both as those literal strings. Unset = silent.
  # Live Caddy /whatsapp/* → :8092. See docs/LUNA-SEND-KILL-SWITCH.md (Sunset).
  hermes-sunset-luna:
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set to whstagingacr.azurecr.io/wh-hermes-staging:<full-master-sha>}
    container_name: hermes-sunset-luna
    restart: unless-stopped
    command: gateway run
    ports:
      - "8092:8092"
    volumes:
      - /var/lib/hermes-sunset-luna:/opt/data
      - /var/lib/hermes-shared:/opt/data/.auth-shared
      - /opt/wolfhouse/WH/docker/hermes-sunset/SOUL.md:/etc/hermes-sunset/SOUL.md:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_ROLE: sunset-luna
      LUNA_TENANT_ID: sunset
      LUNA_CLIENT_SLUG: sunset
      LUNA_ALLOWED_LOCATION_IDS: sunset-somo
      # This WhatsApp runtime is bound to Somo; Sardinero will use a separate number/runtime.
      SUNSET_INGRESS_LOCATION_ID: sunset-somo
      GENERIC_TIMEZONE: Europe/Madrid
      WHATSAPP_CLOUD_WEBHOOK_PORT: "8092"
      # Coalesce rapid guest WhatsApp bursts (quiet window) before agent run.
      WHATSAPP_BURST_COALESCE_ENABLED: "true"
      WHATSAPP_BURST_DEBOUNCE_MS: "5000"
      WHATSAPP_BURST_MAX_MESSAGES: "20"
      WHATSAPP_BURST_MAX_CHARS: "8000"
      # Crowsnest AI-usage values, including the token, come only from the
      # protected env_file below. Do not add empty environment entries here:
      # Compose environment values override env_file values.
    env_file:
      - /etc/hermes-sunset-luna.env

  # Internal Staff email draft-only runtime. No WhatsApp/Discord gateway.
  # Lunabox loopback is for Skipper-local probe only. Staff API in Azure reaches
  # the colocated ACA `luna-sunset-staging-email-luna` (internal TLS ingress).
  # Mount stays /opt/data; canonical credential is /opt/data/.hermes/auth.json.
  # See docs/MAIL-MVP-007-SUNSET-EMAIL-SOL-RUNBOOK.md.
  # Start separately: docker compose --profile sunset-email-luna up -d --no-deps hermes-sunset-email-luna
  hermes-sunset-email-luna:
    profiles:
      - sunset-email-luna
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set to whstagingacr.azurecr.io/wh-hermes-staging:<full-master-sha>}
    container_name: hermes-sunset-email-luna
    restart: unless-stopped
    command:
      - /opt/hermes/.venv/bin/python
      - /etc/hermes-staging/wolfhouse/email_draft_server.py
    ports:
      - "127.0.0.1:8093:8093"
    volumes:
      - /var/lib/hermes-sunset-email-luna:/opt/data
      - /opt/wolfhouse/WH/docker/hermes-sunset/SOUL.md:/etc/hermes-sunset/SOUL.md:ro
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data/.hermes
      HERMES_ROLE: sunset-email-luna
      LUNA_TENANT_ID: sunset
      LUNA_CLIENT_SLUG: sunset
      LUNA_ALLOWED_LOCATION_IDS: sunset-somo
      EMAIL_LUNA_DRAFT_LISTEN_HOST: 0.0.0.0
      EMAIL_LUNA_DRAFT_LISTEN_PORT: "8093"
      GENERIC_TIMEZONE: Europe/Madrid
    env_file:
      - /etc/hermes-sunset-email-luna.env

  # Additive shared Luna HTTP runtime (Sol + Sunset SOUL + wolfhouse_staff_api).
  # No WhatsApp gateway. Live guests stay on hermes-sunset-luna (`gateway run`).
  # Lunabox loopback is for Skipper-local probe only. Staff API reaches the
  # colocated ACA `luna-sunset-staging-luna-http` (internal TLS ingress).
  # See docs/SUNSET-LUNA-HTTP-RUNTIME.md.
  # Start separately: docker compose --profile sunset-luna-http up -d --no-deps hermes-sunset-luna-http
  hermes-sunset-luna-http:
    profiles:
      - sunset-luna-http
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set to whstagingacr.azurecr.io/wh-hermes-staging:<full-master-sha>}
    container_name: hermes-sunset-luna-http
    restart: unless-stopped
    command:
      - /opt/hermes/.venv/bin/python
      - /etc/hermes-staging/wolfhouse/luna_http_server.py
    ports:
      - "127.0.0.1:8094:8094"
    volumes:
      - /var/lib/hermes-sunset-luna-http:/opt/data
      - /opt/wolfhouse/WH/docker/hermes-sunset/SOUL.md:/etc/hermes-sunset/SOUL.md:ro
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data/.hermes
      HERMES_ROLE: sunset-luna-http
      LUNA_TENANT_ID: sunset
      LUNA_CLIENT_SLUG: sunset
      LUNA_ALLOWED_LOCATION_IDS: sunset-somo
      SUNSET_INGRESS_LOCATION_ID: sunset-somo
      LUNA_HTTP_LISTEN_HOST: 0.0.0.0
      LUNA_HTTP_LISTEN_PORT: "8094"
      GENERIC_TIMEZONE: Europe/Madrid
    env_file:
      - /etc/hermes-sunset-luna-http.env
